name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck all bash (pinned image, same as local runs)
        run: |
          mapfile -t files < <(git ls-files 'lib/*.sh' 'bin/*' 'install.sh' 'modules/**/*.sh' 'post-bootstrap/**/*.sh' 'tests/stubs/*' 'tests/integration/*.sh' 'modules/bash/files/bash_bootstrap')
          echo "checking ${#files[@]} files"
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 -x "${files[@]}"

  unit:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: install yq (mikefarah, pinned to match tests/Dockerfile)
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: run unit tests
        run: bats tests/

  integration:
    name: integration (${{ matrix.image }})
    needs: [lint, unit]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:latest", "ubuntu:rolling"]
    steps:
      - uses: actions/checkout@v7
      - name: put the commit under test on a branch install.sh can clone
        run: git checkout -B ci-under-test
      - name: install, check nothing is left to change, re-run
        run: docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" bash /src/tests/integration/run.sh
