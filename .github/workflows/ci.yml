name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck all bash
        run: |
          mapfile -t files < <(git ls-files 'lib/*.sh' 'bin/*' 'install.sh' 'modules/**/*.sh' 'post-bootstrap/**/*.sh')
          echo "checking ${#files[@]} files"
          shellcheck -x "${files[@]}"

  unit:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: install yq (mikefarah, pinned to match tests/Dockerfile)
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: run unit tests
        run: bats tests/
